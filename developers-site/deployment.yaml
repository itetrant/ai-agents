apiVersion: apps/v1
kind: Deployment
metadata:
  name: developers-site
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: developers-site
  template:
    metadata:
      labels:
        app: developers-site
    spec:
      containers:
      - name: developers-site
        image: mmregistry.mmvietnam.com:5000/developers-site:000
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 4000
        env:
        - name: PORT
          value: "4000"
        - name: NODE_ENV
          value: "production"
        envFrom:
          # PROMETHEUS_IPS: danh sach IP Prometheus (cach nhau boi dau phay)
          # duoc phep goi /metrics - STD-API-SD-001 muc 11.1. ConfigMap la
          # optional nen deployment van chay binh thuong neu chua tao.
          - configMapRef:
              name: developers-site-config
              optional: true
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
      imagePullSecrets:
      - name: mmregistry-secret
---
apiVersion: v1
kind: Service
metadata:
  name: developers-site
  namespace: default
spec:
  selector:
    app: developers-site
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
  type: LoadBalancer
